# A hot-reloading dev server for design work, so a CSS change can be looked at
# without a 3 minute image build. Same data directory as the real container, so
# the same artifacts are on screen. Not used in production.
services:
  artifacts-dev:
    image: docker.io/library/node:24-bookworm-slim
    container_name: artifacts-dev
    userns_mode: "keep-id"
    working_dir: /work
    command: sh -c "cd app && node scripts/build-vendor.mjs && npx next dev --hostname 0.0.0.0 --port 5176"
    ports:
      - "5176:5176"
    environment:
      ARTIFACTS_PUBLIC_URL: "http://agentbox:5176"
      ARTIFACTS_DATA: "/work/data"
      ARTIFACTS_THEMES: "/work/themes"
      ARTIFACTS_ASSET_ROOTS: "/home/liam/work:/home/liam/orca:/tmp"
      ARTIFACTS_TMP: "/work/data/tmp"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/work:Z
      - /home/liam/orca:/home/liam/orca:ro
    mem_limit: 2g
    cpus: 3
