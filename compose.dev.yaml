# Indy with hot reload, for working on Indy itself. Runs from the source tree
# with the same one-port layout as the image (dev.mjs), against ./data.
#
#   docker compose -f compose.dev.yaml up
#
# The first start installs dependencies into ./node_modules, so it needs network.
name: indy-dev

services:
  indy-dev:
    image: docker.io/library/node:24-bookworm-slim
    working_dir: /work
    command: >
      sh -c "npm ci --no-audit --no-fund --prefer-offline
      && npm run build:primitives
      && (cd app && node scripts/build-vendor.mjs)
      && node dev.mjs"
    ports:
      - "${INDY_DEV_PORT:-5178}:${INDY_DEV_PORT:-5178}"
    environment:
      PORT: ${INDY_DEV_PORT:-5178}
      INDY_URL: ${INDY_DEV_URL:-http://localhost:5178}
      INDY_DATA: /work/data
      INDY_TMP: /work/data/tmp
      INDY_THEMES: /work/themes
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/work
