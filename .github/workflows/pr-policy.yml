# Closes pull requests from outside the project, as CONTRIBUTING.md says.
#
# Changes are discussed in an issue first. A pull request the maintainer asked
# for there gets reopened by hand; this only runs on "opened", so a reopened
# pull request stays open.
#
# pull_request_target runs with a token that can close the pull request. It
# never checks out or runs the pull request's code.

name: pr-policy

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  close:
    if: ${{ !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) }}
    runs-on: ubuntu-latest
    steps:
      - name: Close with a note
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr close "$PR" --comment "Thanks for this! Indy only takes pull requests that were agreed in an issue first, so this one was closed automatically. See [CONTRIBUTING.md](https://github.com/${{ github.repository }}/blob/main/CONTRIBUTING.md). If you'd like to propose the change, open an issue and link this pull request. If it was already agreed in an issue, it will be reopened."
